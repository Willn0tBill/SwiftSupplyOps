<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SwiftSupply Ops" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>SwiftSupply Ops</title>
    <style>
      /* Emergency mobile guard: prevents any cached desktop/polish CSS from
         leaving the 258px desktop sidebar offset active on phones. */
      @media (max-width: 760px) {
        html, body, #root, .app { width: 100%; max-width: 100%; overflow-x: hidden; }
        .sidebar { display: none !important; }
        .main {
          margin-left: 0 !important;
          width: 100% !important;
          max-width: 100vw !important;
          min-width: 0 !important;
          padding-left: max(14px, env(safe-area-inset-left)) !important;
          padding-right: max(14px, env(safe-area-inset-right)) !important;
        }
        .main > * { min-width: 0; max-width: 100%; }
        .card, .metric, .grid, .twocol, .threecol { min-width: 0; max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Ask an installed PWA to pick up the newest service worker immediately. */
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg) reg.update().catch(function () {});
        }).catch(function () {});
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
